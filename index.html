<style>
:root{--bg:#080b12;--panel:#111725;--panel2:#151e2e;--line:#263248;--text:#f4f7fb;--muted:#9aa8bc;--accent:#8b5cf6;--cyan:#22d3ee}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#1b1740 0,transparent 34%),var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;min-height:100vh}
header{max-width:1120px;margin:auto;padding:28px 22px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{font-size:23px;font-weight:900;letter-spacing:.2px}.logo span{color:var(--cyan)}.tag{color:var(--muted);font-size:13px}
.hero{max-width:1120px;margin:28px auto 30px;padding:0 22px;text-align:center}.pill{display:inline-block;border:1px solid #40356f;background:#201a3d;color:#c4b5fd;border-radius:30px;padding:7px 13px;font-size:12px}
h1{font-size:clamp(32px,6vw,54px);margin:18px 0 10px;line-height:1.2}.grad{background:linear-gradient(90deg,var(--cyan),#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);line-height:1.9;margin:0 auto;max-width:600px}
.wrap{max-width:1120px;margin:auto;padding:0 22px 60px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:22px 0 16px}.section-title h2{font-size:20px;margin:0}.count{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
.tool{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:19px;text-align:right;cursor:pointer;transition:.2s;color:var(--text);min-height:155px;width:100%;font:inherit}
.tool:hover{transform:translateY(-4px);border-color:#7760cb;box-shadow:0 12px 35px #0005}.ico{width:44px;height:44px;display:grid;place-items:center;border-radius:13px;background:#29204b;font-size:22px;margin-bottom:15px}
.tool h3{margin:0 0 7px;font-size:16px}.tool p{margin:0;color:var(--muted);font-size:13px;line-height:1.7}
.workspace{display:none;margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px}.workspace.show{display:block}.work-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.work-head h2{font-size:19px;margin:0}.close{background:#263248;border:0;color:white;border-radius:10px;padding:8px 12px;cursor:pointer}
label{display:block;color:#cbd5e1;font-size:13px;margin:12px 0 7px}input,textarea,select{width:100%;background:#090f1b;border:1px solid var(--line);border-radius:11px;color:white;padding:12px;font:inherit;outline:none}input[type=range]{padding:0}
/* Custom file picker to match the dark purple theme */
input[type=file]{
  color:var(--muted);
  background:#090f1b;
  border:1px solid var(--line);
  padding:8px;
  cursor:pointer;
}
input[type=file]::file-selector-button{
  background:linear-gradient(90deg,#7c3aed,#4f46e5);
  color:#fff;
  border:0;
  border-radius:8px;
  padding:9px 14px;
  margin-inline-end:12px;
  font:inherit;
  font-weight:bold;
  cursor:pointer;
  transition:transform .2s ease,filter .2s ease;
}
input[type=file]::file-selector-button:hover{
  filter:brightness(1.2);
  transform:translateY(-1px);
}
input[type=file]::file-selector-button:active{transform:scale(.96)}input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{min-height:105px;resize:vertical}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}.btn{background:linear-gradient(90deg,#7c3aed,#4f46e5);border:0;color:white;padding:11px 17px;border-radius:11px;cursor:pointer;font-weight:bold;display:inline-block}.btn.secondary{background:#263248}.btn:disabled{opacity:.5;cursor:not-allowed}.result{margin-top:14px;color:#c4b5fd;line-height:1.8;overflow-wrap:anywhere}.hint{color:var(--muted);font-size:12px;line-height:1.8;margin-top:8px}
#qrcode{background:white;padding:12px;display:inline-block;border-radius:12px;margin-top:15px;min-height:20px}#qrcode:empty{display:none}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.stat{background:#0a1120;border:1px solid var(--line);padding:10px 14px;border-radius:10px;color:var(--muted);font-size:13px}
.subtools{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:15px}.subtools .btn{width:100%}
footer{text-align:center;color:#718096;border-top:1px solid #1c2637;padding:24px;font-size:12px}
@media(max-width:600px){header{padding-top:20px}.tag{display:none}.hero{margin-top:18px}.workspace{padding:16px}}

/* Smooth tool animations */
.workspace.show{
 display:block;
 animation:workspaceIn .45s ease both;
}
@keyframes workspaceIn{
 from{opacity:0;transform:translateY(25px) scale(.98)}
 to{opacity:1;transform:translateY(0) scale(1)}
}
.tool{transition:transform .3s ease,box-shadow .3s ease,border-color .3s ease}
.tool:active{transform:scale(.96)}
.btn{transition:transform .2s ease,filter .2s ease}
.btn:hover{transform:translateY(-2px);filter:brightness(1.2)}
.btn:active{transform:scale(.96)}
@media(prefers-reduced-motion:reduce){
 .workspace.show,.tool,.btn{animation:none!important;transition:none!important}
}

<body>
<header><div class="logo">7ambozo <span>Tools</span></div><div class="tag">أدوات بسيطة.. إنجاز أسرع</div></header>
<section class="hero"><span class="pill">✦ أدوات مجانية وسهلة</span><h1>كل أدواتك في <span class="grad">مكان واحد</span></h1><p>استخدم أدوات مفيدة مباشرة من المتصفح، من غير تسجيل حساب أو برامج.</p></section>
<main class="wrap">
 <div class="section-title"><h2>اختار الأداة</h2><span class="count">7 أدوات متاحة</span></div>
 <div class="grid">
  <button class="tool" onclick="openTool('qr')"><div class="ico">▦</div><h3>QR Code Generator</h3><p>حوّل أي رابط أو نص إلى QR Code.</p></button>
  <button class="tool" onclick="openTool('password')"><div class="ico">🔐</div><h3>Password Generator</h3><p>أنشئ كلمة مرور عشوائية قوية.</p></button>
  <button class="tool" onclick="openTool('text')"><div class="ico">✍️</div><h3>Text Tools</h3><p>احسب الكلمات والحروف وانسخ النص بسهولة.</p></button>
  <button class="tool" onclick="openTool('image')"><div class="ico">🖼️</div><h3>Image Compressor</h3><p>قلّل حجم الصورة وحمّل النسخة المضغوطة.</p></button>
  <button class="tool" onclick="openTool('pdf')"><div class="ico">📄</div><h3>PDF Tools</h3><p>حوّل وادمج واستخرج صفحات ملفات PDF.</p></button>
  <button class="tool" onclick="openTool('resize')"><div class="ico">↔️</div><h3>Image Resizer</h3><p>غيّر أبعاد الصور وحمّل النتيجة.</p></button>
  <button class="tool" onclick="openTool('removebg')"><div class="ico">✂️</div><h3>Remove Background</h3><p>تعرّف على طريقة إزالة خلفية الصورة.</p></button>
 </div>
 <section class="workspace" id="workspace"><div class="work-head"><h2 id="toolTitle">الأداة</h2><button class="close" onclick="closeTool()">إغلاق ✕</button></div><div id="toolBody"></div></section>
</main>
<footer>© 2026 7ambozo Tools · صُنع بكل بساطة</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const ws=document.getElementById('workspace'),body=document.getElementById('toolBody'),title=document.getElementById('toolTitle');
if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
function openTool(type){ws.classList.add('show');ws.scrollIntoView({behavior:'smooth',block:'start'});
 if(type==='qr'){title.textContent='QR Code Generator';body.innerHTML=`<label>اكتب رابط أو نص</label><input id="qrText" placeholder="https://example.com"><div class="actions"><button class="btn" onclick="makeQR()">إنشاء QR Code</button></div><div id="qrcode"></div><div id="qrMsg" class="result"></div>`}
 if(type==='password'){title.textContent='Password Generator';body.innerHTML=`<label>طول كلمة المرور</label><input id="passLen" type="number" min="8" max="64" value="16"><div class="actions"><button class="btn" onclick="makePassword()">إنشاء كلمة مرور</button></div><input id="passOut" readonly placeholder="كلمة المرور هتظهر هنا"><div class="actions"><button class="btn secondary" onclick="copyText('passOut')">نسخ</button></div><div class="result">استخدم كلمة مرور مختلفة لكل حساب، واحفظها في مكان آمن.</div>`}
 if(type==='text'){title.textContent='Text Tools';body.innerHTML=`<label>اكتب النص هنا</label><textarea id="textIn" oninput="countText()" placeholder="اكتب أو الصق النص..."></textarea><div class="stats"><div class="stat" id="words">الكلمات: 0</div><div class="stat" id="chars">الحروف: 0</div><div class="stat" id="charsNo">بدون مسافات: 0</div></div><div class="actions"><button class="btn secondary" onclick="copyValue('textIn')">نسخ النص</button><button class="btn secondary" onclick="document.getElementById('textIn').value='';countText()">مسح</button></div>`}
 if(type==='image'){title.textContent='Image Compressor';body.innerHTML=`<label>اختار صورة من جهازك</label><input id="imgFile" type="file" accept="image/*"><label>جودة الصورة (لصور JPG)</label><input id="quality" type="range" min=".3" max=".95" step=".05" value=".75"><div class="actions"><button class="btn" onclick="compressImage()">ضغط الصورة</button></div><div id="imgMsg" class="result"></div>`}
 if(type==='pdf'){title.textContent='PDF Tools';body.innerHTML=`<div class="subtools"><button class="btn" onclick="pdfToJpg()">PDF to JPG</button><button class="btn" onclick="jpgToPdf()">JPG to PDF</button><button class="btn" onclick="mergePdf()">Merge PDF</button><button class="btn" onclick="splitPdf()">Split PDF</button></div><div id="pdfArea"></div>`}
 if(type==='resize'){title.textContent='Image Resizer';body.innerHTML=`<label>اختار صورة</label><input type="file" id="resizeFile" accept="image/*"><label>العرض بالبكسل</label><input type="number" id="resizeW" min="1" max="10000" placeholder="مثلاً 800"><label>الارتفاع بالبكسل</label><input type="number" id="resizeH" min="1" max="10000" placeholder="مثلاً 600"><label><input type="checkbox" id="keepRatio" checked style="width:auto"> الحفاظ على تناسب الأبعاد</label><div class="actions"><button class="btn" onclick="resizeImage()">تغيير الحجم</button></div><div id="resizeMsg" class="result"></div>`}
 if(type==='removebg'){title.textContent='Remove Background';body.innerHTML=`<p class="result">إزالة الخلفية بدقة تحتاج خدمة ذكاء اصطناعي خارجية ومفتاح API. الموقع الحالي لا يحتوي على مفتاح API، لذلك مش هنعرض زر وهمي أو نرفع صورك لأي جهة من غير موافقتك.</p><p class="hint">نقدر نربطها لاحقًا بخدمة إزالة خلفية تختارها، مع توضيح سياسة الخصوصية والتكلفة قبل الاستخدام.</p>`}
}
function closeTool(){ws.classList.remove('show')}
function makeQR(){const v=document.getElementById('qrText').value.trim(),q=document.getElementById('qrcode'),m=document.getElementById('qrMsg');q.innerHTML='';if(!v){m.textContent='اكتب نص أو رابط الأول.';return}if(!window.QRCode){m.textContent='تعذر تحميل مكتبة QR. تأكد من اتصال الإنترنت.';return}new QRCode(q,{text:v,width:200,height:200,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});m.textContent='تم إنشاء الكود. اضغط كليك يمين على الصورة لحفظها.'}
function makePassword(){let n=Math.max(8,Math.min(64,Number(document.getElementById('passLen').value)||16)),chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%&*_-+=';let a=new Uint32Array(n);crypto.getRandomValues(a);document.getElementById('passOut').value=Array.from(a,x=>chars[x%chars.length]).join('')}
function countText(){let s=document.getElementById('textIn').value;document.getElementById('words').textContent='الكلمات: '+(s.trim()?s.trim().split(/\s+/).length:0);document.getElementById('chars').textContent='الحروف: '+s.length;document.getElementById('charsNo').textContent='بدون مسافات: '+s.replace(/\s/g,'').length}
async function copyText(id){let e=document.getElementById(id);try{await navigator.clipboard.writeText(e.value)}catch(_){e.select();document.execCommand('copy')}}
async function copyValue(id){let e=document.getElementById(id);try{await navigator.clipboard.writeText(e.value)}catch(_){e.select();document.execCommand('copy')}}
function downloadBlob(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function compressImage(){let f=document.getElementById('imgFile').files[0],m=document.getElementById('imgMsg');if(!f){m.textContent='اختار صورة الأول.';return}let im=new Image(),url=URL.createObjectURL(f);im.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,1800/Math.max(im.width,im.height));c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(url);if(!b){m.textContent='حصلت مشكلة أثناء ضغط الصورة.';return}let a=document.createElement('a'),u=URL.createObjectURL(b);a.href=u;a.download='7ambozo-compressed.jpg';a.textContent='تحميل الصورة المضغوطة';a.className='btn';a.style.textDecoration='none';m.textContent='الحجم الأصلي: '+(f.size/1024).toFixed(1)+' KB · الحجم الجديد: '+(b.size/1024).toFixed(1)+' KB ';m.appendChild(a)},'image/jpeg',Number(document.getElementById('quality').value))};im.onerror=()=>{URL.revokeObjectURL(url);m.textContent='مش قادر أفتح الصورة دي.'};im.src=url}
function pdfReady(){return !!(window.PDFLib&&window.pdfjsLib&&window.jspdf)}
function pdfToJpg(){document.getElementById('pdfArea').innerHTML=`<label>اختار ملف PDF</label><input type="file" id="pdfFile" accept="application/pdf"><label>رقم الصفحة (سيبها 0 لتحويل كل الصفحات)</label><input type="number" id="pdfPage" min="0" value="0"><div class="actions"><button class="btn" onclick="convertPdf()">تحويل إلى JPG</button></div><div id="pdfMsg" class="result"></div><p class="hint">لو اخترت 0، هيتحمّل ملف JPG منفصل لكل صفحة.</p>`}
async function convertPdf(){const f=document.getElementById('pdfFile').files[0],m=document.getElementById('pdfMsg'),p=Number(document.getElementById('pdfPage').value);if(!f){m.textContent='اختار ملف PDF الأول.';return}if(!window.pdfjsLib){m.textContent='مكتبة PDF لم تُحمّل. تأكد من الإنترنت ثم حدّث الصفحة.';return}try{m.textContent='جاري التحويل...';const doc=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;if(p<0||p>doc.numPages){m.textContent='رقم الصفحة غير صحيح. عدد الصفحات: '+doc.numPages;return}const pages=p===0?Array.from({length:doc.numPages},(_,i)=>i+1):[p];for(const n of pages){const page=await doc.getPage(n),viewport=page.getViewport({scale:1.7}),canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);await page.render({canvasContext:ctx,viewport}).promise;const blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',.92));downloadBlob(blob,`7ambozo-page-${n}.jpg`)}m.textContent='تم تحويل '+pages.length+' صفحة إلى JPG.'}catch(e){m.textContent='تعذر تحويل الملف. تأكد أنه PDF سليم وغير محمي.';console.error(e)}}
function jpgToPdf(){document.getElementById('pdfArea').innerHTML=`<label>اختار صورة أو أكثر</label><input type="file" id="jpgFiles" accept="image/*" multiple><div class="actions"><button class="btn" onclick="convertImages()">تحويل إلى PDF</button></div><div id="pdfMsg" class="result"></div>`}
async function convertImages(){const files=[...document.getElementById('jpgFiles').files],m=document.getElementById('pdfMsg');if(!files.length){m.textContent='اختار صورة واحدة على الأقل.';return}if(!window.jspdf){m.textContent='مكتبة التحويل لم تُحمّل. تأكد من الإنترنت.';return}try{m.textContent='جاري إنشاء PDF...';const {jsPDF}=window.jspdf;let pdf=null;for(let i=0;i<files.length;i++){const data=await fileToDataURL(files[i]);const img=await loadImage(data);const orient=img.width>img.height?'landscape':'portrait';if(!pdf)pdf=new jsPDF({orientation:orient,unit:'pt',format:[img.width,img.height]});else pdf.addPage([img.width,img.height],orient);pdf.addImage(data,files[i].type==='image/png'?'PNG':'JPEG',0,0,img.width,img.height)}pdf.save('7ambozo-images.pdf');m.textContent='تم إنشاء ملف PDF.'}catch(e){m.textContent='حصلت مشكلة أثناء تحويل الصور.';console.error(e)}}
function fileToDataURL(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
function loadImage(src){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src})}
function mergePdf(){document.getElementById('pdfArea').innerHTML=`<label>اختار ملفين PDF أو أكثر (هيتم دمجهم حسب ترتيب الاختيار)</label><input type="file" id="mergeFiles" accept="application/pdf" multiple><div class="actions"><button class="btn" onclick="mergePDFs()">دمج الملفات</button></div><div id="pdfMsg" class="result"></div>`}
async function mergePDFs(){const files=[...document.getElementById('mergeFiles').files],m=document.getElementById('pdfMsg');if(files.length<2){m.textContent='اختار ملفين PDF على الأقل.';return}if(!window.PDFLib){m.textContent='مكتبة PDF لم تُحمّل. تأكد من الإنترنت.';return}try{m.textContent='جاري دمج الملفات...';const merged=await PDFLib.PDFDocument.create();for(const f of files){const src=await PDFLib.PDFDocument.load(await f.arrayBuffer());const pages=await merged.copyPages(src,src.getPageIndices());pages.forEach(page=>merged.addPage(page))}downloadBlob(new Blob([await merged.save()],{type:'application/pdf'}),'7ambozo-merged.pdf');m.textContent='تم دمج '+files.length+' ملفات.'}catch(e){m.textContent='تعذر الدمج. قد يكون أحد الملفات تالفًا أو محميًا.';console.error(e)}}
function splitPdf(){document.getElementById('pdfArea').innerHTML=`<label>اختار ملف PDF</label><input type="file" id="splitFile" accept="application/pdf"><label>رقم الصفحة المطلوبة</label><input type="number" id="splitPage" min="1" value="1"><div class="actions"><button class="btn" onclick="extractPage()">استخراج الصفحة</button></div><div id="pdfMsg" class="result"></div>`}
async function extractPage(){const f=document.getElementById('splitFile').files[0],n=Number(document.getElementById('splitPage').value),m=document.getElementById('pdfMsg');if(!f){m.textContent='اختار ملف PDF الأول.';return}if(!window.PDFLib){m.textContent='مكتبة PDF لم تُحمّل. تأكد من الإنترنت.';return}try{const src=await PDFLib.PDFDocument.load(await f.arrayBuffer()),count=src.getPageCount();if(!Number.isInteger(n)||n<1||n>count){m.textContent='رقم الصفحة لازم يكون من 1 إلى '+count;return}const out=await PDFLib.PDFDocument.create(),[page]=await out.copyPages(src,[n-1]);out.addPage(page);downloadBlob(new Blob([await out.save()],{type:'application/pdf'}),`7ambozo-page-${n}.pdf`);m.textContent='تم استخراج الصفحة '+n+'.'}catch(e){m.textContent='تعذر قراءة ملف PDF.';console.error(e)}}
function resizeImage(){const f=document.getElementById('resizeFile').files[0],m=document.getElementById('resizeMsg');if(!f){m.textContent='اختار صورة الأول.';return}const w=Number(document.getElementById('resizeW').value),h=Number(document.getElementById('resizeH').value),keep=document.getElementById('keepRatio').checked;if(!w&&!h){m.textContent='اكتب العرض أو الارتفاع على الأقل.';return}const url=URL.createObjectURL(f),im=new Image();im.onload=()=>{let nw=w||Math.round(im.width*h/im.height),nh=h||Math.round(im.height*w/im.width);if(keep){const scale=Math.min(w? w/im.width:Infinity,h? h/im.height:Infinity);nw=Math.max(1,Math.round(im.width*scale));nh=Math.max(1,Math.round(im.height*scale))}if(nw<1||nh<1||nw>10000||nh>10000){URL.revokeObjectURL(url);m.textContent='الأبعاد غير مناسبة. استخدم أرقامًا بين 1 و10000.';return}const c=document.createElement('canvas');c.width=nw;c.height=nh;c.getContext('2d').drawImage(im,0,0,nw,nh);c.toBlob(b=>{URL.revokeObjectURL(url);if(!b){m.textContent='فشل تغيير الحجم.';return}downloadBlob(b,'7ambozo-resized.png');m.textContent=`تم تغيير الأبعاد إلى ${nw} × ${nh} بكسل.`},'image/png')};im.onerror=()=>{URL.revokeObjectURL(url);m.textContent='تعذر فتح الصورة.'};im.src=url}
</script>
</body>
